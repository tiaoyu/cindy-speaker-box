<!doctype html><meta charset="utf-8">
<body style="margin:0;padding:12px;font-size:13px">
  <div style="display:flex;flex-direction:column;gap:14px">
    <div>
      <div style="font-weight:600;margin-bottom:6px">唤醒词</div>
      <select id="wakeWord" style="background:var(--surface,#fff);color:inherit;border:1px solid var(--border-default,#e4e4e0);border-radius:6px;padding:6px 10px;min-width:180px">
        <option value="嘿辛蒂">嘿辛蒂</option>
        <option value="你好辛蒂">你好辛蒂</option>
        <option value="小辛蒂">小辛蒂</option>
        <option value="嘿小辛">嘿小辛</option>
        <option value="你好小辛">你好小辛</option>
      </select>
      <div style="opacity:0.6;margin-top:4px;font-size:12px">保存后立即生效；若正在聆听会自动重启监听</div>
    </div>

    <div>
      <div style="font-weight:600;margin-bottom:6px">播报音量 <span id="volLabel">100%</span></div>
      <input id="volume" type="range" min="0.2" max="2" step="0.1" style="width:100%">
    </div>

    <label class="switch-row" style="display:flex;align-items:center;justify-content:space-between">
      <span>启动 Cindy 后自动开始聆听</span>
      <input type="checkbox" id="autoStart">
    </label>

    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-weight:600">输入设备（麦克风）</div>
        <button type="button" id="refreshDevices" style="background:transparent;color:inherit;border:1px solid var(--border-default,#e4e4e0);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px">刷新设备</button>
      </div>
      <select id="inputDevice" style="background:var(--surface,#fff);color:inherit;border:1px solid var(--border-default,#e4e4e0);border-radius:6px;padding:6px 10px;width:100%">
        <option value="">系统默认输入</option>
      </select>
    </div>

    <div>
      <div style="font-weight:600;margin-bottom:6px">输出设备（耳机 / 扬声器）</div>
      <select id="outputDevice" style="background:var(--surface,#fff);color:inherit;border:1px solid var(--border-default,#e4e4e0);border-radius:6px;padding:6px 10px;width:100%">
        <option value="">系统默认输出</option>
      </select>
      <div id="deviceHint" style="opacity:0.6;margin-top:4px;font-size:12px">保存后立即用于录音和播报。列表为空时可点「刷新设备」。插拔耳机后请再刷新一次。</div>
    </div>

    <div style="opacity:0.85;font-size:12px;line-height:1.7;display:flex;flex-direction:column;gap:10px">
      <div>
        <div style="font-weight:600;margin-bottom:2px">模型目录</div>
        <code id="modelsDir" style="font-size:11px;word-break:break-all">加载中…</code>
        <div style="opacity:0.7;margin-top:2px">约 600MB，首次使用请在插件面板点「下载语音模型」。</div>
      </div>
      <div>
        <div style="font-weight:600;margin-bottom:2px">声音设备</div>
        <div id="soundHint" style="opacity:0.85"></div>
      </div>
      <div>
        <div style="font-weight:600;margin-bottom:2px">麦克风权限</div>
        <div id="micHint" style="opacity:0.85"></div>
      </div>
    </div>

    <button id="save" style="align-self:flex-start;background:#2f6fed;color:#fff;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;font-weight:600">保存设置</button>
  </div>
  <script src="/settings.js"></script>
</body>
